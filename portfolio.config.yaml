# ── About ──────────────────────────────────────────────────────────────
about: |
  I build, test, and validate electromechanical systems from CAD concept through to qualified, working prototype. My work focuses on process qualification, precision assembly, and system integration.

  I hold an MSc in Robotics & Autonomous Systems (Merit) from the University of Sussex and a BEng in Mechanical Engineering (8.92/10 GPA). I have hands-on experience with PLC-controlled automation (Siemens), ROS2 mobile robotics, sensor integration, and technical documentation.

